spring.datasource.url=jdbc:mysql://mysql-podproducer:3306/podproducerdb
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.jpa.hibernate.ddl-auto=create

podcastExists.api.url=http://edufy-podcast-service:8080/pods/podcasts/podcasts/{id}/exists
podcastAssociated.api.url=http://edufy-podcast-service:8080/pods/podcasts/podcasts/{podcastid}/producerassociated/{producerid}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/edufy-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/edufy-realm/protocol/openid-connect/certs

