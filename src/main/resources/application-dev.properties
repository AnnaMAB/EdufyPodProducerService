spring.datasource.url=jdbc:mysql://localhost:3308/podproducerdb
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.jpa.hibernate.ddl-auto=create-drop

podcastExists.api.url=http://localhost:8081/pods/podcasts/podcasts/{id}/exists
podcastAssociated.api.url=http://localhost:8081/pods/podcasts/podcasts/{podcastid}/producerassociated/{producerid}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/edufy-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/edufy-realm/protocol/openid-connect/certs